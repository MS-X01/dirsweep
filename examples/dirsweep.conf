# ~/.config/dirsweep/config   (or /etc/dirsweep.conf, or -C FILE)
#
# One "key = value" per line. Lines starting with # are comments.
# This file is parsed, never executed. Command-line options win.
# path, exclude and junk may be repeated; exclude/junk also take comma lists.

# What to clean when no PATH is given on the command line
# path = ~/projects

# Skip these (extended regex, matched against the path relative to the target)
exclude = (^|/)node_modules(/|$)
exclude = (^|/)\.git(/|$)

# Extra junk patterns on top of the built-in ones (see: dirsweep --list-junk)
# junk = *.dump, *.core

# Leave anything touched in the last two weeks alone (30 = days, 12h, 2w ...)
min_age = 14

# Always keep an undo record
trash = true

# banner = true            # false: never print the banner
# strict = false          # true: only truly empty directories
# max_depth = 0           # 0 = unlimited
# cross_fs = false
# follow_symlinks = false
# log = ~/dirsweep.log
